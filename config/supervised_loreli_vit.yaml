run_name: supervised_vit_loreli_${dataset.name}

experiment:
  _target_: src.experiments.RegressionExperiment

model:
  _target_: src.models.Regressor
  loss: l2
  net: ${net}
  summary_net: null

data:
  target_indices: [0, 1, 2, 3, 4]
  val_frac: 0.10
  test_frac: 0.15
  on_gpu: False
  summarize: False
  num_workers: 4
  summary_batch_size: 64

training:
  epochs: 500
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 64
  test_batch_size: 128
  augment: False
  save_freq: 50
  use_amp: False
  
  augmentations: []
  
  gradient_norm: 10.0
  
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    max_lr: ${training.lr}
    total_steps: null

defaults:
  - default
  - dataset: loreli_ds
  - preprocessing: loreli_supervised
  - net: vit_loreli_supervised
  - _self_
