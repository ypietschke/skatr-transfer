# Loreli AA* 'mod' noisy cropped to z=5.0..13.15 supervised preprocessing.
# Median chosen to match the dataset-level voxel median measured on
# ~200 cubes from loreli_downsampled_z13_aastar_mod/ (~-0.1 mK ~ 0). The
# wedge-cut noisy field is symmetric around 0; ShiftMedian(0) leaves it
# centred in the linear region of the symmetric-log Clamp transform.
x:
  - {_target_: src.utils.transforms.AddSingletonChannel}
  - {_target_: src.utils.transforms.ShiftMedian, median: 0.0}
  - {_target_: src.utils.transforms.Clamp}

y:
  - {
    _target_: src.utils.transforms.Center,
    lo: [0.1, 738.9, 0.0, 8.0, 0.05],
    hi: [10.0, 10504.7, 1.0, 9.7421766, 0.5],
    indices: "${data.target_indices}"
  }
