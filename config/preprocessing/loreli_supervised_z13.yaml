# Loreli (clean) cropped to z=5.0..13.15 supervised preprocessing.
# Median chosen to match the dataset-level voxel median measured on
# ~200 cubes from loreli_downsampled_z13/ (=~-28 mK). This shifts the bulk
# of voxels to ~0 before the symmetric-log transform, putting them in the
# linear region of the Clamp transform and preserving signal dynamic range.
x:
  - {_target_: src.utils.transforms.AddSingletonChannel}
  - {_target_: src.utils.transforms.ShiftMedian, median: -28.0}
  - {_target_: src.utils.transforms.Clamp}

y:
  - {
    _target_: src.utils.transforms.Center,
    lo: [0.1, 738.9, 0.0, 8.0, 0.05],
    hi: [10.0, 10504.7, 1.0, 9.7421766, 0.5],
    indices: "${data.target_indices}"
  }
